<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>1</title>
        <link rel="stylesheet" href="css/bootstrap.min.css">
        <link href="css/styles.css" rel="stylesheet">
        <script src="js/vue.global.js"></script>
    </head>
    <body>
        <div class="wrapper">
            <div class="sample">
                <form @submit.prevent="done = true">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="text" class="form-control" v-model.trim="email">
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text" class="form-control" v-model.trim="phone">
                    </div>
                    <div class="form-group">
                        <label>FN</label>
                        <input type="text" class="form-control" v-model.trim="firstName">
                    </div>
                    <div class="form-group">
                        <label>LN</label>
                        <input type="text" class="form-control" v-model.trim="lastName">
                    </div>
                    <div class="form-group">
                        <label>Guests</label>
                        <input type="button" class="btn btn-primary" value="+" @click="guests.push('')">
                    </div>
                    <div class="form-group" v-for="(guest, i) in guests" :key="i">
                        <label>Guest {{ i + 1 }}</label>
                        <input type="text" class="form-control" v-model.trim="guests[i]">
                    </div>
                    <hr>
                    <button :disabled="!isFilled" type="submit" class="btn btn-success">Send Data</button>
                </form>
                <div v-if="done" class="mt-4">
                    <h2>All done!</h2>
                    <table class="table table-bordered">
                        <tr>
                            <td>Email</td>
                            <td>{{ email }}</td>
                        </tr>
                        <tr>
                            <td>Phone</td>
                            <td>{{ phone }}</td>
                        </tr>
                        <tr>
                            <td>Full Name</td>
                            <td>{{ firstName }} {{ lastName }}</td>
                        </tr>
                        <tr v-for="(guest, i) in filledGuests" :key="i">
                            <td>Guest {{ i + 1 }}</td>
                            <td>{{ guest }}</td>
                        </tr>
                    </table>
                </div>
            </div>
        </div>
        <script>
            Vue.createApp({
                data: () => ({
                    email: '',
                    phone: '',
                    firstName: '',
                    lastName: '',
                    guests: [],
                    done: false
                }),
                computed: {
                    isFilled(){
                        return this.email && this.phone && this.firstName && this.lastName;
                    },
                    filledGuests(){
                        return this.guests.filter(guest => guest.trim() !== '');
                    }
                }
            }).mount('.sample');
        </script>
    </body>
</html>
