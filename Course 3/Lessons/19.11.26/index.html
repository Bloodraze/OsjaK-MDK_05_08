<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>index</title>
        <link rel="stylesheet" href="css/bootstrap.min.css">
        <link rel="stylesheet" href="css/styles.css">
        <script src="js/vue.global.js"></script>
    </head>
    <body>
        <div class="wrapper">
            <div class="sample">
                <input type="text" v-model="name" v-on:click="name += '!'">
                /*
                    v-show
                    v-if
                    v-for
                    v-bind :value
                    v-on v-on:click @click
                    v-model двустороняя связь
                /*
                <hr>
                <p>Hello, {{ name }}!</p>
            </div>
        </div>
        <script>
            let app = Vue.createApp({
                data(){
                    return{
                        name: ''
                    }
                },
                methods:{
                    onInput(e){
                        this.name = e.target.value + '!!!';
                    }
                }
            });
            let root = app.mount('.sample');
            console.log(root);
        </script>
    </body>
</html>
