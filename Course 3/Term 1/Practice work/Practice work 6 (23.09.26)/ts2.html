<!DOCTYPE html>
<html lang="ru">
    <head>

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="style_ts2.css">

            <button class="arrow right-arrow" type="button"></button>
        </div>

        <div class="polaroid-block">

                    src="src/Pepperoni.jpg" alt="Пицца Пепперони">

            <div class="polaroid photo-two">

            </div>
        </div>

        <button class="big-button" type="button">
            Большая кнопка
        </button>

        <div class="transform-wrapper">
            <div class="transform-card">
                Наведи на меня
            </div>
        </div>

        <div class="center-block">
            <img
                src="src/tetoberry.png"
                alt="Тето Клубника по центру"
            >
